# Use the latest 2.1 version of CircleCI pipeline process engine.
version: 2.1

# Executors define the environment in which jobs will run
executors:
  ruby:
    docker:
      - image: cimg/ruby:3.2.0
      - image: postgres:11-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shopping_test
      - image: redis:7-alpine
    working_directory: ~/shopping_mart
    environment:
      BUNDLE_JOBS: 3
      BUNDLE_RETRY: 3
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/shopping_test

# Reusable commands
commands:
  setup_dependencies:
    description: "Install Ruby dependencies"
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "Gemfile.lock" }}
            - v1-dependencies-
      - run:
          name: Install bundler
          command: gem install bundler
      - run:
          name: Bundle Install
          command: bundle install --jobs 3 --retry 3
      - save_cache:
          paths:
            - vendor/bundle
          key: v1-dependencies-{{ checksum "Gemfile.lock" }}

  setup_database:
    description: "Setup test database"
    steps:
      - run:
          name: Wait for PostgreSQL
          command: |
            for i in {1..30}; do
              pg_isready -h localhost -p 5432 && exit 0
              echo "Waiting for PostgreSQL..."
              sleep 1
            done
            exit 1
      - run:
          name: Create database
          command: bundle exec rake db:create
      - run:
          name: Run migrations
          command: bundle exec rake db:migrate
      - run:
          name: Seed database
          command: bundle exec rake db:seed

# Define jobs
jobs:
  checkout_code:
    executor: ruby
    steps:
      - checkout
      - save_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - ~/shopping_mart

  build:
    executor: ruby
    steps:
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}
      - setup_dependencies
      - run:
          name: Precompile assets
          command: bundle exec rake assets:precompile

  test:
    executor: ruby
    steps:
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}
      - setup_dependencies
      - setup_database
      - run:
          name: Run RSpec tests
          command: bundle exec rspec --format progress --format RspecJunitFormatter --out ~/rspec.xml
      - store_test_results:
          path: ~/rspec.xml
      - store_artifacts:
          path: ~/rspec.xml
          destination: test-results/rspec.xml
      - run:
          name: Upload coverage
          command: |
            if [ -d "coverage" ]; then
              echo "Coverage report generated"
            fi
      - store_artifacts:
          path: coverage
          destination: coverage-report

  lint:
    executor: ruby
    steps:
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}
      - setup_dependencies
      - run:
          name: Run RuboCop
          command: |
            if gem list rubocop -i > /dev/null; then
              bundle exec rubocop
            else
              echo "RuboCop not installed in Gemfile"
            fi
          when: always

  security_check:
    executor: ruby
    steps:
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}
      - setup_dependencies
      - run:
          name: Check for security vulnerabilities
          command: |
            bundle audit check --update 2>/dev/null || echo "Bundle audit not available"
          when: always

# Orchestrate jobs using workflows
workflows:
  version: 2.1

  build_and_test:
    jobs:
      - checkout_code
      - build:
          requires:
            - checkout_code
      - test:
          requires:
            - checkout_code
      - lint:
          requires:
            - checkout_code
          when: always
      - security_check:
          requires:
            - checkout_code
          when: always
