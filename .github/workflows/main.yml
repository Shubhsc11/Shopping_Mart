name: "Ruby on Rails CI/CD Workflow"

on:
  push:
    branches:
      - "**"
    tags:
      - "release-*"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:11-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: shopping_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://postgres:password@localhost:5432/shopping_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Add or replace dependency steps here
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.0
          bundler-version: 2.5.6
          bundler-cache: true
      - name: Ensure Bundler and tsort
        run: |
          gem install bundler -v 2.5.6
          gem install tsort -v 0.2.0 || true
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && break || sleep 1
          done
      - name: Set up database
        run: bin/rails db:prepare
      # Add or replace test runners here
      - name: Run tests
        run: bundle exec rake
      - name: RuboCop (Code Quality)
        run: bundle exec rubocop --parallel
      - name: Rails boot check
        run: bundle exec rails runner "puts 'Rails app booted successfully'"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.0
          bundler-version: 2.5.6
          bundler-cache: true
      - name: Install dependencies
        run: |
          gem install bundler -v 2.5.6
          gem install tsort -v 0.2.0 || true
          bundle install --jobs 4 --retry 3
      - name: Lint Ruby files
        run: bundle exec rubocop --parallel
