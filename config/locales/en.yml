# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   "true": "foo"
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  hello: "Hello world"

  messages:
    delivery_address:
      limit_reached: 'You can only have up to 5 delivery addresses.'
      created: 'Delivery address was successfully created.'
      updated: 'Delivery address was successfully updated.'
      deleted: 'Delivery address was successfully deleted.'

    order:
      place_success: 'Order placed successfully!!!'
      place_failure: 'Failed to place order. Please try again.'
      cancel_success: 'Order was successfully cancelled.'
      cancel_failure: 'Cannot cancel order. It may have already been cancelled or is not eligible for cancellation.'
      not_found: 'Order not found'
      status_updated: 'Order status updated successfully.'
      status_update_failed: 'Failed to update order status.'

    users:
      points_added: 'Points added successfully.'
