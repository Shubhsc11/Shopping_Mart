# Render Blueprint for Rails
services:
  - type: web
    name: shopping_dev_web
    env: ruby
    plan: free
    buildCommand: bundle install && bundle exec rake db:migrate
    startCommand: bundle exec rails server -p 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopping_dev
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
    autoDeploy: true
  - type: postgresql
    name: shopping_dev
    plan: free
