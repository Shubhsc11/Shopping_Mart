# Render Blueprint for Rails
services:
  # PostgreSQL Database
  - type: pg
    name: shopping_dev_db
    plan: free

  # Rails Web Service
  - type: web
    name: shopping_dev_web
    env: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopping_dev_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
    autoDeploy: true
