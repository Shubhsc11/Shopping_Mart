# Render Blueprint for Rails

databases:
  - name: shopping_dev_db
    databaseName: shopping_dev
    user: shopping_dev
    plan: free

services:
  - type: web
    name: shopping_dev_web
    runtime: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
      bundle exec rails db:seed
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopping_dev_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 2
    autoDeploy: true
